# базовые настройки ParkingScan, переменные окружения PARKINGSCAN_* имеют приоритет

# уровень логирования: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# каталог с весами и контрактом инференса config.json
models_dir: models

# каталог с данными: калибровки площадок, БД, кропы
data_dir: data

# максимальный размер загружаемого файла в мегабайтах
max_upload_mb: 50

# порог уверенности по умолчанию для /occupancy/detect и /occupancy/render;
# измерен на 35 снимках val-сплита как оптимальный для подсчёта машин:
# медиана отклонения счёта 7.7%, F1 0.836 (tests/check_detector.py);
# vis_conf из models/config.json оптимален для F1 боксов, но недосчитывает машины;
# параметр conf в запросе перекрывает это значение
default_conf: 0.25

# опорная точка машины по 7.3: середина нижней стороны бокса, поднятая на эту долю его высоты
ground_offset: 0.15

# поиск разметки, шаги 1-5 раздела 7.2; доли - от локального размера машины в данной точке кадра;
# значения подобраны на 4 снимках data/samples (tests/check_markings.py)
calibration:
  # большая сторона кадра, на котором ищется разметка, в пикселях
  work_side: 2000
  # минимум машин для модели масштаба, иначе отказ no_scale
  scale_min_cars: 5
  # рабочая зона: ожидаемая ширина машины в пикселях исходного кадра и доля полудиагонали;
  # 150 вместо стартовых 120 - при 120 в зону попадали дальние ряды, где разметка не читается
  roi_min_car_px: 150
  roi_max_radius: 0.9
  # ядро white top-hat в долях ширины машины
  tophat_kernel: 0.25
  # локальный порог вместо глобального Оцу: среднее top-hat плюс paint_sigma отклонений в окне
  # шириной в машину; глобальный порог пропускал текстуру плитки, листвы и асфальта
  paint_sigma: 2.0
  paint_min_contrast: 20
  # белая краска - насыщенность HSV не выше этого значения (0-255), жёлтая проходит по тону
  paint_max_saturation: 60
  # расширение боксов машин при вычитании и максимальная ширина штриха
  car_mask_dilate: 0.1
  # доля высоты бокса машины снизу, которая не вырезается: разделители лежат у нижней кромки бокса,
  # а кузов и крыша - выше; расширение car_mask_dilate применяется только к вырезаемой части
  car_mask_keep_bottom: 0.25
  max_stroke: 0.15
  # склейка парных краёв LSD: допуск по углу в градусах и по расстоянию между краями
  merge_angle_deg: 3
  merge_dist: 0.08
  # сшивка обрывков одной линии; обрывки короче piece_min длины машины в сшивку не идут
  piece_min: 0.06
  link_angle_deg: 5
  link_gap: 0.5
  # длина разделителя в долях длинной стороны машины; 0.25 вместо стартовых 0.4 -
  # в ближнем поле разделители видны частично и обрезаны краем кадра
  seg_len_min: 0.25
  seg_len_max: 2.0
  # сборка рядов, шаг 6: допуск по углу между разделителями в градусах
  row_angle_deg: 12
  # шаг между соседними разделителями в долях ширины машины; 0.5 вместо стартовых 0.7 -
  # на косом ракурсе шаг сжат перспективой, на GOPR6537 настоящие соседи стоят с шагом от 0.67
  gap_min: 0.5
  gap_max: 2.5
  # сдвиг соседних разделителей вдоль их направления в долях длинной стороны машины;
  # заменяет требование перекрытия отрезков, которое не выполняется на косой парковке
  row_shift: 1.0
  # гибрид 7.2: ряд собирается от этого числа наблюдаемых разделителей - двух хватает на направление и шаг
  row_min_dividers: 2
  # шаг ряда ровно из двух наблюдаемых разделителей: у пары нельзя отличить одно место от двух,
  # поэтому диапазон уже общего; от трёх разделителей работает gap_max
  pair_gap_min: 0.7
  pair_gap_max: 1.4
  # коэффициент вариации шага ряда после заполнения пропусков
  row_gap_cv: 0.35
  # пустой ряд принимается, если он не дальше этого числа длин машины от принятого ряда
  row_neighbour_gap: 2.5
  # наибольший пропуск, заполняемый интерполяцией, в медианных шагах ряда
  max_fill_gap: 3
  # гибрид 7.2: ход ряда по сетке наружу прекращается после стольких не принятых ячеек подряд;
  # 1 проверено и отвергнуто: на GOPR6537 recall падает с 0.50 до 0.28
  max_projected_run: 2
  # площадь места в квадратах ширины машины
  slot_area_min: 0.6
  slot_area_max: 3.0
  # минимум мест для статуса ok
  min_slots: 3
